[project]
name = "autoins"
version = "0.1.0"
description = "Knowledgenet example: auto-insurance claim adjudication"
requires-python = ">=3.13"
dependencies = [
  "opentelemetry-distro==0.60b1",
  "opentelemetry-exporter-otlp==1.39.1",
  "pydantic==2.12.5",
  "knowledgenet",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
knowledgenet = { path = "../../knowledgenet" }
